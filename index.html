<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101f35"><title>Sports Academy 1.2 — The Living Season</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#edf2fb;background:#0b1728}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:22px 16px 90px}.eyebrow{font-size:11px;letter-spacing:.13em;color:#e8bf62;font-weight:800;text-transform:uppercase}h1{font-size:clamp(29px,7vw,46px);line-height:1.08;margin:10px 0}h2{margin:6px 0 12px;font-size:24px}p{color:#c6d2e0;line-height:1.6}.panel{background:#16283f;border:1px solid #30445e;border-radius:18px;padding:20px;margin:14px 0}.hero{padding:45px 20px;text-align:center;background:radial-gradient(ellipse at 50% 100%,#396584,#101f35 70%);border-radius:20px;border:1px solid #56738b}.tree{font-size:65px}.muted{color:#a7b9cc}.small{font-size:13px}button,input,select{font:inherit}button{border:0;border-radius:11px;background:#e4b95b;color:#142238;padding:12px 15px;font-weight:800;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#304964;color:white}button:disabled{opacity:.5;cursor:not-allowed}input,select{width:100%;background:#0d1e32;color:#fff;border:1px solid #60728b;border-radius:10px;padding:12px;margin:6px 0 15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.choice{background:#203a55;color:white;text-align:left;min-height:75px}.choice.selected{outline:2px solid #e4b95b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#203a55;padding:13px;border-radius:12px;text-align:center}.stat b{font-size:24px;display:block;color:#e4b95b}.log{border-left:2px solid #bd9552;padding:3px 0 9px 13px;margin:12px 0}.log b{color:#fff}.nav{display:flex;flex-wrap:wrap;gap:5px}.nav button{font-size:12px}.tag{display:inline-block;border:1px solid #60728b;border-radius:40px;padding:5px 10px;margin:3px;font-size:12px}.success{color:#9ce0b8}.warning{color:#f0cd82}@media(max-width:410px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main id="app"></main><script>
'use strict';const KEY='sports-academy-1-2-save';const lands=['🏔️ The Mountains','🌊 The Oceanside','🏜️ The Desert','🌲 The Forest','🌾 The Plains','❄️ The Frozen North'];const foes=['Stonebridge','Crownspire','Pinehaven','Red Valley','Northgate','Summit Prep','Stonebridge','Summit Invitational'];const defaultState=()=>({stage:'intro',step:0,academy:'Summit Valley Academy',mascot:'Eagles',land:'🌊 The Oceanside',colors:'Navy & Gold',coach:'Eli Navarro',philosophy:'Development',week:1,phase:0,w:0,l:0,development:62,morale:60,coachTrust:60,isaiah:50,darius:55,malik:25,promise:false,promiseKept:false,mentor:false,seed:1734,history:[],last:null,completed:false});let s;try{s=JSON.parse(localStorage.getItem(KEY))||defaultState()}catch{s=defaultState()}const el=document.getElementById('app');function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem(KEY,JSON.stringify(s))}function remember(title,detail){s.history.unshift({week:s.week,title,detail});save()}function rnd(){s.seed=(Math.imul(s.seed,1664525)+1013904223)>>>0;return s.seed/4294967296}function set(k,v){s[k]=v;save();render()}function nextStep(){s.step++;save();render()}function intro(){return `<div class="hero"><div class="tree">🌱</div><div class="eyebrow">The Summit awaits</div><h1>Every legend begins with nothing.</h1><p>One tree. An empty academy. No trophies. No history. The story begins with your decisions.</p><button onclick="set('stage','found')">Found Your Academy →</button></div>`}function founding(){let content='';if(s.step===0)content=`<h2>Choose your homeland</h2><p>Six regions in a fictional world. Your academy will grow from this landscape.</p><div class="grid">${lands.map(l=>`<button class="choice ${s.land===l?'selected':''}" onclick="set('land','${l}')">${l}</button>`).join('')}</div>`;if(s.step===1)content=`<h2>Name your academy</h2><label>Academy name<input id="name" maxlength="48" value="${esc(s.academy)}"></label><label>Mascot<input id="mascot" maxlength="30" value="${esc(s.mascot)}"></label><label>School colors<input id="colors" maxlength="40" value="${esc(s.colors)}"></label>`;if(s.step===2)content=`<h2>Hire your founding coach</h2><p>Each coach brings a different leadership style.</p>${[['Eli Navarro','Patient developer · strong relationships'],['Mara Bennett','Disciplined strategist · tactical focus'],['Jonah Reed','Aggressive recruiter · high expectations']].map(([n,d])=>`<button class="choice ${s.coach===n?'selected':''}" onclick="set('coach','${n}')"><b>${n}</b><br><span class="small">${d}</span></button>`).join('')}`;if(s.step===3)content=`<h2>Choose your philosophy</h2><p>This choice shapes the academy's identity and early decisions.</p>${['Development','Recruiting','Team Culture'].map(p=>`<button class="choice ${s.philosophy===p?'selected':''}" onclick="set('philosophy','${p}')">${p}</button>`).join('')}`;return `<div class="eyebrow">The Founding · Step ${s.step+1} of 4</div><div class="panel">${content}<hr style="border-color:#34475b"><button onclick="${s.step===1?"s.academy=document.getElementById('name').value.trim()||'Summit Valley Academy';s.mascot=document.getElementById('mascot').value.trim()||'Eagles';s.colors=document.getElementById('colors').value.trim()||'Navy & Gold';save();":''}${s.step===3?'startSeason()':'nextStep()'}">${s.step===3?'Open the Academy →':'Continue →'}</button></div>`}function startSeason(){s.stage='season';s.week=1;s.phase=0;s.development=s.philosophy==='Development'?67:62;s.morale=s.philosophy==='Team Culture'?68:60;s.malik=s.philosophy==='Recruiting'?38:25;remember('The Founding',`${s.academy} (${s.mascot}) was founded in ${s.land} with ${s.colors}, coach ${s.coach}, and a ${s.philosophy.toLowerCase()} philosophy.`);save();render()}function choice(kind){if(kind==='isaiah'){s.isaiah+=9;s.coachTrust+=2;remember('A Freshman Heard','The director gave Isaiah Cole a voice in the program.')}if(kind==='darius'){s.darius+=9;s.morale+=3;remember('Veteran Leadership','Darius Kent was entrusted with leading the locker room.')}if(kind==='mentor'){s.mentor=true;s.development+=5;s.isaiah+=3;s.darius+=3;remember('Mentorship Begins','Darius helped Isaiah in practice.')}if(kind==='train'){s.development+=7;s.morale-=3;remember('Demanding Practices','Intensive training accelerated development but strained morale.')}if(kind==='promise'){s.promise=true;s.malik+=15;remember('A Recruiting Promise','Malik Carter was promised an individual development pathway.')}if(kind==='roster'){s.development+=3;s.coachTrust+=3;remember('The Film Room','Coaches focused on the current roster.')}if(kind==='fulfill'){s.promiseKept=true;s.malik+=22;s.coachTrust+=4;remember('Promise Kept','The staff showed Malik a concrete development plan.')}if(kind==='delay'){s.malik=Math.max(0,s.malik-12);s.development+=3;remember('Promise Delayed','Malik questioned the academy’s commitment.')}s.phase++;save();render()}function game(who){const strength=s.development+s.morale*.12+s.coachTrust*.08+(who==='isaiah'?s.isaiah:s.darius)*.06;const difficulty=79+(s.week%3)*3;let margin=Math.max(-15,Math.min(15,Math.round(strength-difficulty+(rnd()-.5)*22)));const win=margin>=0;const us=60+Math.floor(rnd()*24);const them=us+(win?-Math.max(1,margin):Math.max(1,-margin));s.last={us,them,win,who,foe:foes[s.week-1]};if(win)s.w++;else s.l++;s.morale=Math.max(0,Math.min(100,s.morale+(win?5:-4)));if(who==='isaiah')s.isaiah+=5;else s.darius+=5;remember(win?'Eagles Win':'A Lesson in Defeat',`${s.academy} ${win?'defeated':'fell to'} ${s.last.foe}, ${us}–${them}. ${who==='isaiah'?'Isaiah':'Darius'} was trusted in the key moments.`);s.phase=3;save();render()}function advance(){if(s.week===8){s.completed=true;s.stage='complete'}else{s.week++;s.phase=0;s.last=null}save();render()}function season(){const panel=[`<h2>Leadership Meeting</h2><p>${esc(s.coach)} wants to settle the tension between freshman Isaiah Cole and veteran Darius Kent.</p><button onclick="choice('isaiah')">Listen to Isaiah (+trust)</button><button class="secondary" onclick="choice('darius')">Back Darius (+trust)</button>`,`<h2>Development Day</h2><p>Allocate limited staff time. ${s.mentor?'Your mentoring program is already taking shape.':''}</p><button onclick="choice('mentor')">Pair Darius with Isaiah</button><button class="secondary" onclick="choice('train')">Intensive team training</button>`,`<h2>Game Day: ${foes[s.week-1]}</h2><p>Choose who leads the offense in the decisive moments. The simulation considers development, morale, coach trust, and player trust.</p><button onclick="game('isaiah')">Trust Isaiah</button><button class="secondary" onclick="game('darius')">Trust Darius</button>`,`<h2>${s.last?.win?'Victory!':'A Tough Loss'}</h2><h1>${s.last?.us} – ${s.last?.them}</h1><p>Summit Valley vs. ${s.last?.foe}. ${s.promise&&!s.promiseKept?'Malik Carter is waiting for proof of the promise you made.':'Recruit Malik Carter, or focus on the roster.'}</p>${s.promise&&!s.promiseKept?`<button onclick="choice('fulfill')">Fulfill Malik’s promise</button><button class="secondary" onclick="choice('delay')">Delay the promise</button>`:`<button onclick="choice('promise')">Promise Malik a development pathway</button><button class="secondary" onclick="choice('roster')">Focus on the current roster</button>`}`,`<h2>Academy Times</h2><p>${esc(s.history[0]?.detail||'A new week begins.')}</p><p>${s.promiseKept?'Malik remembers that you followed through.':s.promise?'Malik is waiting to see whether you keep your word.':'Malik remains interested in the program.'}</p><button onclick="advance()">${s.week===8?'Complete Year One':'Advance to Next Week →'}</button>`];return `<div class="eyebrow">Year One · Week ${s.week} / 8 · ${['Leadership','Development','Game Day','Consequences','Academy Times'][s.phase]}</div><h1>${esc(s.academy)}</h1><p>${esc(s.land)} · ${esc(s.mascot)} · ${esc(s.colors)} · Coach ${esc(s.coach)}</p><div class="stats"><div class="stat"><b>${s.w}–${s.l}</b>Record</div><div class="stat"><b>${s.development}</b>Development</div><div class="stat"><b>${s.morale}</b>Morale</div><div class="stat"><b>${s.coachTrust}</b>Coach trust</div><div class="stat"><b>${s.isaiah}</b>Isaiah trust</div><div class="stat"><b>${s.darius}</b>Darius trust</div></div><div class="panel">${panel[s.phase]}</div><div class="panel"><h2>Recruiting</h2><p>Malik Carter · Point Guard · Potential 94</p><div class="tag">Interest ${s.malik}%</div><div class="tag">${s.promiseKept?'Promise fulfilled':s.promise?'Promise outstanding':'No promise made'}</div></div>${historyView()}` }function historyView(){return `<div class="panel"><h2>History Ledger</h2>${s.history.slice(0,25).map(e=>`<div class="log"><span class="eyebrow">Week ${e.week}</span><br><b>${esc(e.title)}</b><p class="small">${esc(e.detail)}</p></div>`).join('')}</div>`}function complete(){return `<div class="hero"><div class="tree">🌳</div><div class="eyebrow">Year One complete</div><h1>The Eagles Have a History</h1><h2>${s.w}–${s.l}</h2><p>Eight games and a season of choices. Your academy's story has begun.</p><button onclick="download()">Export Developer Save (JSON)</button><button class="secondary" onclick="restart()">Found a New Academy</button></div>${historyView()}`}function download(){const blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sports-academy-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restart(){if(confirm('Reset the saved academy and start over?')){s=defaultState();save();render()}}function render(){el.innerHTML=`<div class="eyebrow">Sports Academy · Developer Prototype 1.2</div>${s.stage==='intro'?intro():s.stage==='found'?founding():s.stage==='season'?season():complete()}<div class="nav"><button class="secondary" onclick="download()">Export Save</button><button class="secondary" onclick="document.getElementById('importSave').click()">Import Save</button><button class="secondary" onclick="restart()">Reset Game</button></div><input id="importSave" type="file" accept="application/json" style="display:none" onchange="importSave(event)"><p class="small muted">Auto-saves locally in this browser. Prototype gameplay and fictional teams; not a commercial release.</p>`}function importSave(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const v=JSON.parse(reader.result);if(!v||!['intro','found','season','complete'].includes(v.stage)||!Array.isArray(v.history)||typeof v.week!=='number')throw Error('Invalid save');s=v;save();render()}catch{alert('This does not look like a compatible Sports Academy save.')}};reader.readAsText(f)}render();
</script></body></html>
